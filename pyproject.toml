[project]
name = "sbom-validation"
version = "0.1.0"
description = "Standards-based SBOM validation"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = []

[tool.poetry]
packages = [{ include = "sbom_validation", from = "src" }]

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2"
sphinx-needs = "^9.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
