[project]
name = "sbom-validation"
version = "0.1.0"
description = "Standards-based SBOM validation"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = ["jsonschema (>=4.26.0,<5.0.0)", "license-expression (>=30.4.4,<31.0.0)", "packageurl-python (>=0.17.6,<0.18.0)"]

[project.scripts]
sbom-validation = "sbom_validation.cli:main"

[tool.poetry]
packages = [{ include = "sbom_validation", from = "src" }]
include = [{ path = "src/sbom_validation/formats/schemas/*.json", format = ["sdist", "wheel"] }]

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2"
sphinx-needs = "^9.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
