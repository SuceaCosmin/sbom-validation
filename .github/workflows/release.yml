name: Release

# Creating a tag such as v0.1.0 builds, tests and publishes the Windows exe.
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release and upload its assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install --with test,build

      - name: Check the tag matches the project version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (poetry version --short).Trim()
          if ($env:TAG -ne "v$version") {
            throw "Tag '$env:TAG' does not match pyproject.toml version '$version' (expected 'v$version')."
          }

      - name: Run tests
        run: poetry run pytest
      - name: Build executable
        shell: pwsh
        run: ./scripts/build-exe.ps1
      - name: Test executable end to end
        run: poetry run pytest tests/e2e -v

      - name: Prepare release assets
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $asset = "sbom-validation-$env:TAG-windows-x64.exe"
          Copy-Item dist/sbom-validation.exe "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLower()
          "$hash  $asset" | Set-Content -Encoding ascii "dist/$asset.sha256"
          Write-Host "$hash  $asset"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG `
            "dist/sbom-validation-$env:TAG-windows-x64.exe" `
            "dist/sbom-validation-$env:TAG-windows-x64.exe.sha256" `
            --title $env:TAG --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
