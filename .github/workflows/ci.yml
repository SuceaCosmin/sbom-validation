name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install --with docs,test,build
      - name: Run tests
        run: poetry run pytest
      - name: Build documentation
        run: poetry run sphinx-build -W -b html docs docs/_build/html
      # Same environment as the tests above; no second install.
      - name: Build executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-exe.ps1
      - name: Test executable end to end
        if: runner.os == 'Windows'
        run: poetry run pytest tests/e2e -v
      - name: Upload executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-validation-windows
          path: dist/sbom-validation.exe
